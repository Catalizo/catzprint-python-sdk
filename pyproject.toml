[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "catzprint"
version = "2.1.4"
description = "Official Python SDK for the CatzPrint cloud printing API (sync and async)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Catalizo", email = "info@catalizo.com" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1"]
keywords = ["catzprint", "printing", "receipt", "escpos", "pdf", "api", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]

[project.optional-dependencies]
sealed = ["pynacl>=1.5"]
dev = ["pynacl>=1.5", "pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://catzprint.com"
Documentation = "https://catzprint.com/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/catzprint"]

[tool.hatch.build.targets.sdist]
include = ["src/catzprint", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: talks to a live CatzPrint API (needs CATZPRINT_TEST_FIXTURE)"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "A"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/catzprint", "tests", "examples"]

[[tool.mypy.overrides]]
module = ["nacl", "nacl.*"]
ignore_missing_imports = true
